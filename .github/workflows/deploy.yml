name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check TMDB proxy URL
        run: |
          if [ -z "$TMDB_PROXY_URL" ]; then
            echo "::error::TMDB_PROXY_URL is not set. Add it under Settings > Secrets and variables > Actions (Variables or Secrets)."
            exit 1
          fi
        env:
          TMDB_PROXY_URL: ${{ vars.TMDB_PROXY_URL || secrets.TMDB_PROXY_URL }}
      - run: npm run build
        env:
          # Public URL of the TMDB proxy (worker/). Read from a repository variable
          # or a repository secret, whichever TMDB_PROXY_URL is stored as.
          REACT_APP_TMDB_PROXY_URL: ${{ vars.TMDB_PROXY_URL || secrets.TMDB_PROXY_URL }}
      # Publishes build/ to the gh-pages branch, which GitHub Pages serves
      # (Settings -> Pages -> Deploy from a branch -> gh-pages).
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build
